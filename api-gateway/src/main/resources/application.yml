spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**
        - id: company-service
          uri: lb://company-service
          predicates:
            - Path=/companies/**

  eureka:
    client:
      service-url:
        defaultZone: http://eureka-server:8761/eureka

  server:
    port: 8080